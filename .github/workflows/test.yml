name: Linting and Testing

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint with Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Lint with ruff
        run: |
          ruff check .

  validate:
    name: Validate with hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare integration layout
        run: |
          mkdir -p "$RUNNER_TEMP/hassfest/nymea"
          cp -a "$GITHUB_WORKSPACE/." "$RUNNER_TEMP/hassfest/nymea/"

      - name: Hassfest validation
        run: |
          docker run --rm \
            -v "$RUNNER_TEMP/hassfest:/github/workspace" \
            ghcr.io/home-assistant/hassfest

  tests:
    name: Run tests
    runs-on: ubuntu-latest
    needs: [lint, validate]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-homeassistant-custom-component \
            "websockets>=15.0" "zeroconf==0.136.2"

      - name: Run tests
        run: |
          mkdir -p "$RUNNER_TEMP/ha-test/custom_components"
          ln -s "$GITHUB_WORKSPACE" "$RUNNER_TEMP/ha-test/custom_components/nymea"
          PYTHONPATH="$RUNNER_TEMP/ha-test" pytest tests/ -v
